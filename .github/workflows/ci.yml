# Checks that run on pull requests, which `deploy.yml` does not: it fires only
# on push to main, so until now nothing verified a PR before merge. Note the
# full `npm run build` (tsc -b && vite build) rather than deploy's bare
# `npx vite build` — this is the only place typechecking runs in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
